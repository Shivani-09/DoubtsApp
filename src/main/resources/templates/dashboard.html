<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e6ffe6; flex-direction: column; margin: 0;}
        h1 { color: #28a745; margin-bottom: 20px;}
        p { font-size: 1.2em; color: #555; }
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to your Dashboard!</h1>
        <p>You have successfully logged in.</p>
        <p><a href="/login-page">Go back to Login</a></p>
    </div>
</body>
</html>
